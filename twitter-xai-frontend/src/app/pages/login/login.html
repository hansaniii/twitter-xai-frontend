<div class="login-container">
    <p-card class="login-card shadow-5">
        <!-- Logo / Icon -->
        <div class="logo">
            <i class="pi pi-twitter text-blue-500 text-4xl"></i>
        </div>

        <!-- Title -->
        <h2 class="title">Twitter XAI</h2>
        <p class="subtitle">
            Understand your sentiment patterns with explainable AI
        </p>

        <!-- Login Button -->
        <button pButton label="Continue with Sample Analysis" icon="pi pi-twitter" class="p-button-primary w-full"
            (click)="loginWithSampleData()"></button>



        <!-- Divider -->
        <div class="divider">
            <span>Safe • Private • Transparent</span>
        </div>

        <!-- Info -->
        <p class="info">
            We analyze your tweets to help you stay aware of negative exposure.
            No content is posted on your behalf.
        </p>
    </p-card>
</div>
